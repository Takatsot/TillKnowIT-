# Local SQL Server until the .NET Aspire AppHost is added.
# SQL Server 2022 or later is required (PowerSync's SQL Server source needs it).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Tillknowit_Dev1!"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true" # CDC, used by PowerSync, runs on SQL Server Agent
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
volumes:
  sqldata:
