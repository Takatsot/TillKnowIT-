name: Publish the apps to GitHub Pages

# Every app is built for its own path under one Pages site: https://<owner>.github.io/<repo>/till/, /back-office/ and so on.
# Needs Settings > Pages > Source: GitHub Actions (switched on once). If a run says "Failed to create deployment (404)", that setting is the cause.
# The apps talk to the API at the address in the repository variable API_URL (Settings > Secrets and variables > Actions > Variables), for example https://tillknowit-api.onrender.com
on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/manuals/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The repository variable API_URL wins; otherwise the address Render gives the service named in render.yaml.
      VITE_API_URL: ${{ vars.API_URL || 'https://tillknowit-api.onrender.com' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build every app for its path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p ../site
          for app in till back-office supplier-portal admin parent-app insights-portal field-agent; do
            PAGES_BASE="/${repo}/${app}/" npm run build -w "@tillknowit/${app}"
            mkdir -p "../site/${app}"
            cp -r "apps/${app}/dist/." "../site/${app}/"
          done
          cp pages/index.html ../site/index.html
          mkdir -p ../site/manuals
          cp -r ../docs/manuals/. ../site/manuals/
          rm -f ../site/manuals/_template.html
          touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
